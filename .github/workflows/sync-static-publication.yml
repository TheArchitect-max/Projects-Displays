name: Static publication sync (one-shot candidate CI)
on:
  push:
    branches:
      - portfolio/sync-123-assets-20261113
    paths:
      - .github/workflows/sync-static-publication.yml
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Retrieve pinned public hub source
        shell: bash
        run: |
          git clone --filter=blob:none https://github.com/TheArchitect-max/MyProjects.git /tmp/myprojects-source
          git -C /tmp/myprojects-source checkout --detach 28f29a547d0a753825e09c1e80ba75ac81014515
          test "$(git -C /tmp/myprojects-source rev-parse HEAD)" = "28f29a547d0a753825e09c1e80ba75ac81014515"
      - name: Synchronise and verify all 123 static displays
        run: python3 tools/sync_snapshot.py /tmp/myprojects-source
      - name: Confirm candidate matches the pinned source without writes
        shell: bash
        run: |
          git diff --exit-code -- assets products index.html acquisition.html methodology.html sources.html 404.html robots.txt sitemap.xml catalogue.csv identity-register.csv project-map.json PRESENTATION_NOTICE.txt .nojekyll PUBLICATION_AUDIT_2026-11-13.md
          git status --porcelain --untracked-files=all | tee /tmp/publication-status.txt
          test ! -s /tmp/publication-status.txt
          echo "FINAL_CANDIDATE_VERIFICATION=PASS"
